name: Backup V2 Phase 4A Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-v2-phase4a-preflight
  cancel-in-progress: false

jobs:
  phase4a-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select included Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify foundation contracts
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/test-backup-v2-foundation.mjs

      - name: Verify zero-spend contracts
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/test-backup-v2-zero-spend.mjs

      - name: Verify workflow safety contract
        run: node scripts/test-backup-v2-workflow-contract.mjs

      - name: Type-check repository
        run: npx tsc --noEmit

      - name: Lint Phase 4A files
        run: npx eslint src/lib/backups/v2 scripts/test-backup-v2-foundation.mjs scripts/test-backup-v2-zero-spend.mjs scripts/test-backup-v2-workflow-contract.mjs
